services:
  mongodb:
    image: mongo:7
    container_name: quicktask-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kuldeep7860/quicktask-backend:latest
    container_name: quicktask-backend
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/quicktask
     
      
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
     
    image: kuldeep7860/quicktask-frontend:latest
    container_name: quicktask-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
